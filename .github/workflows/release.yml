name: Release Resource Pack and Datapack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # A non-shallow repository clone is required for PackSquash

      - name: Temporarily hide huge files from PackSquash
        run: |
          mkdir -p /tmp/hidden-textures/assets/elytratrims/textures/feature
          if [ -f resource-pack/assets/elytratrims/textures/feature/bad_apple.png ]; then
            mv resource-pack/assets/elytratrims/textures/feature/bad_apple.png /tmp/hidden-textures/assets/elytratrims/textures/feature/
          fi

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'resource-pack'
            output_file_path = 'resource-pack.zip'

      - name: Re-inject huge files into optimized zip
        run: |
          if [ -f /tmp/hidden-textures/assets/elytratrims/textures/feature/bad_apple.png ]; then
            # Restore to original directory for consistency
            mv /tmp/hidden-textures/assets/elytratrims/textures/feature/bad_apple.png resource-pack/assets/elytratrims/textures/feature/
            # Inject directly into the zip
            cd resource-pack
            zip -u ../resource-pack.zip assets/elytratrims/textures/feature/bad_apple.png
          fi

      - name: Create Datapack Zip
        run: |
          cd data-pack
          zip -r ../datapack.zip data/ pack.mcmeta
          cd ..

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use run_id (globally unique per workflow run)
          TAG_NAME="v$(date +'%Y.%m.%d')-${{ github.run_id }}"
          gh release create "$TAG_NAME" resource-pack.zip datapack.zip \
            --title "College Debt SMP Custom Resources - $TAG_NAME" \
            --notes "Automated release containing the latest custom paintings and optimized resources."
